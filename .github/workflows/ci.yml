name: Publish Artifact

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  upload_to_maven_central:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: adopt
          java-version: '21'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: maven

      - name: Check project version
        run: .ci/scripts/check-version.sh

      - name: Install gpg key
        run: echo -e "${{ secrets.GPG_SECRET_KEY }}" | base64 --decode | gpg --batch --import

      - name: Test
        run: mvn --batch-mode --update-snapshots verify

      - name: Publish artifact
        run: mvn --no-transfer-progress --batch-mode deploy -P release -DskipTests -Dgit-code-format.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASS_PHRASE }}
